#
# https://github.com/actions/checkout/issues/1590#issuecomment-2567109195
#
# We manually start a container and execute scripts in it instead of using `jobs.build.container`,
# otherwise we couldn't use GitHub-provided actions (checkout, cache, etc.) as they rely on Node20
# which would not necessarily be available on some containers (e.g., Ubuntu 18.04).
#
# See: https://github.com/actions/checkout/issues/1590
#
name: Action Build System
on: [push, pull_request, workflow_dispatch]
env:
  CONTAINER: ubuntu:18.04

jobs:
  linux:
    name: Linux Build
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - name: Start Docker Container
      run: |
        docker pull $CONTAINER
        docker run --name build-container -d -v ${{github.workspace}}:/desktop $CONTAINER tail -f /dev/null

    - name: Install Development Tools Packages
      env:
        SCRIPT: |
          # Add i386 architecture
          dpkg --add-architecture i386

          # Update repository
          apt-get update > /dev/null

          # Install build dependencies
          apt-get install -qq -y pkg-config wget unzip build-essential gcc-multilib g++-multilib make cmake > /dev/null
      run: docker exec build-container bash -c "$SCRIPT"

    - name: Execute Build
      env:
        SCRIPT: |
          # Open workspace directory
          cd /desktop

          # Build via Makefile
          make

      run: docker exec build-container bash -c "$SCRIPT"

    - name: Deploy artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux32
        path: ${{github.workspace}}/package

  windows:
    name: Windows Build
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -A Win32 -DCMAKE_BUILD_TYPE=Release

    - name: Execute Build
      run: |
        cmake --build build --config Release

        # Organize package structure
        New-Item -ItemType Directory -Force -Path package/addons/amxmodx/modules
        New-Item -ItemType Directory -Force -Path package/addons/amxmodx/scripting/include

        Copy-Item build/Release/memstore_amxx.dll package/addons/amxmodx/modules/
        Copy-Item include/memstore.inc package/addons/amxmodx/scripting/include/
        Copy-Item plugins/test_memstore.sma package/addons/amxmodx/scripting/
        Copy-Item plugins/example_top15.sma package/addons/amxmodx/scripting/

    - name: Deploy artifacts
      uses: actions/upload-artifact@v4
      with:
        name: win32
        path: ${{github.workspace}}/package
